<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>D4Drive</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #14161a;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #app {
        display: grid;
        place-items: center;
        height: 100%;
      }
      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="color:#f4f1ea;padding:24px;max-width:460px">D4Drive needs JavaScript. Turn it on for this site and reload.</p>
    </noscript>
    <!-- Browsers too old for ES modules never run the game code at all; tell them why. -->
    <script nomodule>
      document.getElementById('app').innerHTML =
        '<p style="color:#f4f1ea;padding:24px;max-width:460px">D4Drive needs a newer browser. Update Chrome, Firefox, Safari or Edge, then open this page again.</p>';
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
